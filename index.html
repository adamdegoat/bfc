<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>BFC — Best Fighting Championship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=VT323&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#e11d2e; --red2:#ff2d40; --gold:#f5c542; --gold2:#ffe08a;
  --ink:#0a0c12; --ink2:#11131c; --panel:rgba(16,18,28,.82); --line:rgba(255,255,255,.10);
  --txt:#f3f4f8; --dim:rgba(243,244,248,.6);
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--txt);
  font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ── top bar ── */
#topbar{position:relative;z-index:40;display:flex;align-items:center;gap:10px;
  padding:8px 12px;background:linear-gradient(180deg,rgba(8,9,14,.96),rgba(8,9,14,.7) 70%,transparent);
  flex:0 0 auto}
.brand{display:flex;align-items:baseline;gap:7px;text-decoration:none}
.brand .b1{font-family:'Cinzel',serif;font-weight:900;font-size:21px;letter-spacing:1px;
  color:#fff;text-shadow:0 1px 0 #000}
.brand .b1 .r{color:var(--red2)}
.brand .b2{font-family:'VT323',monospace;font-size:12px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
#evchip{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{background:rgba(225,29,46,.16);border:1px solid rgba(225,29,46,.5);color:#ffd9dd;
  border-radius:999px;padding:4px 11px;font-size:11px;font-weight:800;letter-spacing:.4px;white-space:nowrap}
.chip b{color:#fff}
.hublink{color:var(--dim);text-decoration:none;font-size:11px;font-weight:700;border:1px solid var(--line);
  border-radius:999px;padding:5px 10px;white-space:nowrap}
.hublink:hover{color:#fff;border-color:var(--gold)}

/* ── stage ── */
#stage{position:relative;flex:1 1 auto;overflow:hidden}
#scene-svg{position:absolute;inset:0;width:100%;height:100%}
#scene-svg svg{width:100%;height:100%;display:block}
#daze{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 8%,transparent 55%,rgba(0,0,0,.5));z-index:5}
#fighters{position:absolute;inset:0;z-index:10}
.fg{position:absolute;bottom:8%;transform:translateX(-50%);cursor:pointer;transition:filter .2s;
  display:flex;flex-direction:column;align-items:center;will-change:transform}
.fg:hover{filter:drop-shadow(0 0 9px rgba(245,197,66,.6))}
.fg .nametag{margin-top:2px;font-size:9px;font-weight:800;letter-spacing:.2px;color:#fff;
  background:rgba(0,0,0,.55);border-radius:5px;padding:1px 6px;white-space:nowrap;
  border-bottom:2px solid var(--cc,#888)}
.fg .nametag .belt{color:var(--gold)}
.char-svg{display:block;filter:drop-shadow(0 5px 5px rgba(0,0,0,.45))}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:5px;
  max-width:150px;background:rgba(12,14,22,.94);border:1px solid var(--line);border-radius:10px;
  padding:5px 9px;font-size:11px;line-height:1.25;color:#eef;text-align:center;
  box-shadow:0 6px 16px rgba(0,0,0,.5);opacity:0;transition:opacity .3s;pointer-events:none}
.bubble.show{opacity:1}
.bubble:after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:rgba(12,14,22,.94)}
.bubble .bn{font-size:8.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;margin-bottom:1px}

/* ── scene toggle ── */
#scenetabs{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:25;
  display:flex;gap:5px;background:rgba(8,9,14,.7);border:1px solid var(--line);border-radius:999px;
  padding:4px;backdrop-filter:blur(8px)}
.stab{border:none;background:transparent;color:var(--dim);font-family:inherit;font-size:11px;font-weight:700;
  padding:5px 11px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
.stab.on{background:var(--red);color:#fff}
.stab .e{font-size:13px}
.stab.live:after{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 7px var(--gold);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── side buttons ── */
#sidebtns{position:absolute;right:10px;top:10px;z-index:25;display:flex;flex-direction:column;gap:7px}
.sbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:11px;
  padding:8px 11px;font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.3px;cursor:pointer;
  backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.sbtn:hover{border-color:var(--gold)}
.sbtn .e{font-size:14px}

/* ── bottom mic / pulse ── */
#mic{position:relative;z-index:30;flex:0 0 auto;background:linear-gradient(0deg,rgba(8,9,14,.97),rgba(8,9,14,.78));
  border-top:1px solid var(--line);padding:8px 12px 10px;max-height:30vh;display:flex;flex-direction:column;gap:5px}
#pulse{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gold2);font-weight:600;line-height:1.3}
#pulse .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--red2);box-shadow:0 0 8px var(--red2)}
#transcript{overflow:hidden;font-size:12.5px;line-height:1.45}
#transcript .desc{color:var(--dim);font-style:italic;margin-bottom:3px}
#transcript .ln{margin:1px 0}
#transcript .ln b{color:var(--cc,#fff)}
#micfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
#micfoot a{color:var(--gold);text-decoration:none;font-size:11px;font-weight:800;letter-spacing:.3px}
#micfoot .ev{font-size:10px;color:var(--dim);font-weight:700}

/* ── overlays ── */
.ov{position:fixed;inset:0;z-index:80;background:rgba(4,5,9,.74);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:14px}
.ov.show{display:flex}
.sheet{background:linear-gradient(180deg,var(--ink2),#0a0b11);border:1px solid var(--line);
  border-radius:18px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.7);position:relative}
.sheet::-webkit-scrollbar{width:0}
.x{position:absolute;top:10px;right:12px;z-index:3;background:rgba(0,0,0,.4);border:1px solid var(--line);
  color:#fff;width:30px;height:30px;border-radius:50%;font-size:17px;cursor:pointer;line-height:1}
.sh-head{font-family:'Cinzel',serif;font-weight:900;font-size:16px;letter-spacing:.5px;color:#fff;
  padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sh-head .e{color:var(--red2)}

/* rankings board */
.rk-tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 12px 4px;scrollbar-width:none}
.rk-tabs::-webkit-scrollbar{display:none}
.rk-tab{flex:0 0 auto;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim);
  border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
.rk-tab.on{background:var(--gold);color:#1a1300;border-color:var(--gold)}
.rk-list{padding:8px 12px 16px}
.rk-row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:10px;cursor:pointer;
  border:1px solid transparent}
.rk-row:hover{background:rgba(255,255,255,.04);border-color:var(--line)}
.rk-row.champ{background:linear-gradient(90deg,rgba(245,197,66,.16),rgba(245,197,66,.02));
  border-color:rgba(245,197,66,.35)}
.rk-pos{flex:0 0 30px;text-align:center;font-family:'VT323',monospace;font-size:19px;color:var(--dim)}
.rk-row.champ .rk-pos{color:var(--gold)}
.rk-info{flex:1 1 auto;min-width:0}
.rk-nm{font-size:13px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-nm .nick{color:var(--dim);font-weight:600;font-size:11px}
.rk-sub{font-size:10.5px;color:var(--dim)}
.rk-rec{flex:0 0 auto;font-family:'VT323',monospace;font-size:16px;color:var(--gold2)}
.rk-strk{font-size:9px;font-weight:800;padding:1px 5px;border-radius:5px;margin-left:5px}

/* fight card poster */
.poster{padding:0 0 16px}
.poster-top{text-align:center;padding:18px 16px 12px;background:
  radial-gradient(120% 100% at 50% 0%,rgba(225,29,46,.28),transparent 70%);border-bottom:1px solid var(--line)}
.poster-top .ev{font-family:'Cinzel',serif;font-weight:900;font-size:30px;letter-spacing:1px;color:#fff;line-height:1}
.poster-top .sub{font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-top:5px}
.poster-top .when{font-size:11px;color:var(--dim);margin-top:3px}
.bout{padding:11px 14px;border-bottom:1px solid var(--line)}
.bout .bl{font-size:9.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);
  text-align:center;margin-bottom:6px}
.bout.main .bl{color:var(--gold)}
.bout-row{display:flex;align-items:center;justify-content:center;gap:8px}
.bcorner{flex:1 1 0;min-width:0;text-align:center}
.bcorner .fl{font-size:17px}
.bcorner .nm{font-size:13px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcorner .rc{font-family:'VT323',monospace;font-size:14px;color:var(--gold2)}
.bcorner.win .nm{color:var(--gold)}
.bcorner.win:after{content:' ✓';color:#4ade80}
.vs{flex:0 0 auto;font-family:'Cinzel',serif;font-weight:900;color:var(--red2);font-size:14px}
.bout .res{text-align:center;font-size:10.5px;color:#4ade80;font-weight:700;margin-top:5px}
.belt-i{color:var(--gold)}

/* stat card */
.sc-hero{display:flex;gap:12px;padding:14px 16px;align-items:flex-start;
  background:radial-gradient(100% 120% at 100% 0%,rgba(225,29,46,.18),transparent 60%)}
.sc-fig{flex:0 0 96px;height:128px;display:flex;align-items:flex-end;justify-content:center;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent);border-radius:12px;border:1px solid var(--line)}
.sc-id{flex:1 1 auto;min-width:0}
.sc-nm{font-family:'Cinzel',serif;font-weight:900;font-size:19px;color:#fff;line-height:1.05}
.sc-nick{font-size:12px;font-weight:700;color:var(--gold);font-style:italic;margin:1px 0 6px}
.sc-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.sc-bdg{font-size:9.5px;font-weight:800;letter-spacing:.3px;padding:2px 7px;border-radius:6px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);color:#fff}
.sc-bdg.belt{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1a1300;border:none}
.sc-bdg.cond{background:rgba(74,222,128,.14);color:#86efac;border-color:rgba(74,222,128,.3)}
.sc-bdg.cond.hurt{background:rgba(248,113,113,.14);color:#fca5a5;border-color:rgba(248,113,113,.3)}
.sc-rec{font-family:'VT323',monospace;font-size:30px;color:var(--gold2);line-height:.9}
.sc-rec small{font-size:12px;color:var(--dim)}
.sc-style{font-size:12px;color:var(--dim);padding:0 16px 4px;font-style:italic}
.sc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px 16px}
.sc-stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:7px 8px;text-align:center}
.sc-stat .v{font-family:'VT323',monospace;font-size:18px;color:#fff}
.sc-stat .k{font-size:8.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
.sc-hook{padding:8px 16px 4px;font-size:12.5px;line-height:1.4;color:#d9dbe6}
.sc-attr{padding:6px 16px 16px}
.attr-row{display:flex;align-items:center;gap:8px;margin:4px 0}
.attr-row .k{flex:0 0 78px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--dim)}
.attr-bar{flex:1 1 auto;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.attr-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--red),var(--gold))}
.sc-last{margin:0 16px 14px;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.04);
  border:1px solid var(--line);font-size:11.5px;color:var(--dim)}
.sc-last b{color:#fff}

@media(max-width:560px){
  .brand .b1{font-size:18px}
  #sidebtns .sbtn span.t{display:none}
  #sidebtns .sbtn{padding:9px}
  .stab span.t{display:none}
  .poster-top .ev{font-size:24px}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <a class="brand" href="./">
      <span class="b1">B<span class="r">F</span>C</span>
      <span class="b2">Best Fighting Championship</span>
    </a>
    <div id="evchip">
      <span class="chip" id="ev-chip">—</span>
      <a class="hublink" href="https://adamdegoat.github.io/neverendingworld/">◂ World</a>
    </div>
  </div>

  <div id="stage">
    <div id="scene-svg"></div>
    <div id="daze"></div>
    <div id="fighters"></div>
    <div id="sidebtns">
      <button class="sbtn" onclick="openOv('rankings')"><span class="e">🏆</span><span class="t">Rankings</span></button>
      <button class="sbtn" onclick="openOv('card')"><span class="e">📋</span><span class="t">Fight Card</span></button>
    </div>
    <div id="scenetabs"></div>
  </div>

  <div id="mic">
    <div id="pulse"><span class="dot"></span><span id="pulse-txt">—</span></div>
    <div id="transcript"></div>
    <div id="micfoot">
      <span class="ev" id="mic-ev">—</span>
      <a href="story.html">Read the full story ▸</a>
    </div>
  </div>
</div>

<!-- rankings overlay -->
<div class="ov" id="ov-rankings" onclick="if(event.target===this)closeOv()">
  <div class="sheet">
    <button class="x" onclick="closeOv()">×</button>
    <div class="sh-head"><span class="e">🏆</span> BFC World Rankings</div>
    <div class="rk-tabs" id="rk-tabs"></div>
    <div class="rk-list" id="rk-list"></div>
  </div>
</div>

<!-- card overlay -->
<div class="ov" id="ov-card" onclick="if(event.target===this)closeOv()">
  <div class="sheet">
    <button class="x" onclick="closeOv()">×</button>
    <div class="poster" id="poster"></div>
  </div>
</div>

<!-- stat card overlay -->
<div class="ov" id="ov-stat" onclick="if(event.target===this)closeOv()">
  <div class="sheet" id="statsheet">
    <button class="x" onclick="closeOv()">×</button>
    <div id="statbody"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════
   BFC front-end. Data: data/characters.json, world.json, feed.json
   ════════════════════════════════════════════════════════════════════ */
const DIVS = {
  featherweight:{label:'Featherweight',short:'FW',emoji:'🪶',weight:'145'},
  lightweight:{label:'Lightweight',short:'LW',emoji:'⚡',weight:'155'},
  middleweight:{label:'Middleweight',short:'MW',emoji:'🔥',weight:'185'},
  light_heavyweight:{label:'Light Heavyweight',short:'LHW',emoji:'💪',weight:'205'},
  heavyweight:{label:'Heavyweight',short:'HW',emoji:'🗿',weight:'265'},
};
const DIV_ORDER = Object.keys(DIVS);
const SCENES = ['gym','weighin','arena','recovery'];
const SCENE_META = {
  gym:{label:'Gym',emoji:'🏋️'}, weighin:{label:'Weigh-Ins',emoji:'⚖️'},
  arena:{label:'Arena',emoji:'🏟️'}, recovery:{label:'Recovery',emoji:'🩹'},
};
let S = {chars:{},world:{},feed:[]};
let curScene = null, viewScene = null, rkTab = 'lightweight';

async function loadData(){
  const bust = '?t='+Date.now();
  const [c,w,f] = await Promise.all([
    fetch('data/characters.json'+bust).then(r=>r.json()),
    fetch('data/world.json'+bust).then(r=>r.json()),
    fetch('data/feed.json'+bust).then(r=>r.json()),
  ]);
  S.chars=c; S.world=w; S.feed=f;
  render();
}

/* ── helpers ── */
const F = id => S.chars[id] || {};
const fn = id => (F(id).name)||id;
const firstName = id => fn(id).split(' ')[0];
function recStr(c){const r=c.record||{w:0,l:0,d:0};return r.w+'-'+r.l+(r.d?('-'+r.d):'')}
function rankTag(c){return c.champion?'C':('#'+(c.rank))}

/* ════════════ SCENES — bespoke SVG backdrops (viewBox 0 0 1000 600) ════════════ */
function sceneSVG(scene){
  if(scene==='gym') return GYM();
  if(scene==='weighin') return WEIGHIN();
  if(scene==='arena') return ARENA();
  return RECOVERY();
}
const spec = (n,fn)=>{let s='';for(let i=0;i<n;i++)s+=fn(i);return s};

function GYM(){
  // crowd of heavy bags + a cage platform + ring, industrial wall
  const bags = spec(5,i=>{const x=120+i*60;return `<g transform="translate(${x} 250)"><rect x="-1.5" y="-110" width="3" height="60" fill="#3a3f4a"/><rect x="-13" y="-52" width="26" height="80" rx="11" fill="#${i%2?'b23b3b':'2a2f3a'}"/><rect x="-13" y="-52" width="26" height="80" rx="11" fill="url(#bagsh)"/><rect x="-13" y="-40" width="26" height="5" fill="#00000033"/><rect x="-13" y="-12" width="26" height="5" fill="#00000033"/></g>`});
  const trusses = spec(7,i=>`<rect x="${60+i*135}" y="0" width="5" height="46" fill="#1a1e27"/>`);
  const lights = spec(6,i=>`<g transform="translate(${110+i*160} 44)"><rect x="-22" y="-6" width="44" height="9" rx="3" fill="#11141c"/><ellipse cx="0" cy="40" rx="60" ry="120" fill="url(#beam)" opacity=".10"/></g>`);
  const winds = spec(3,i=>`<rect x="${560+i*140}" y="70" width="110" height="120" rx="6" fill="url(#win)" opacity=".55"/><line x1="${615+i*140}" y1="70" x2="${615+i*140}" y2="190" stroke="#0a0c12" stroke-width="3"/>`);
  return `<svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gwall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2030"/><stop offset="1" stop-color="#10131c"/></linearGradient>
    <linearGradient id="gfloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262a36"/><stop offset="1" stop-color="#171a23"/></linearGradient>
    <linearGradient id="bagsh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff18"/><stop offset="1" stop-color="#00000033"/></linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b5a7a"/><stop offset="1" stop-color="#1a2738"/></linearGradient>
    <radialGradient id="beam" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#ffe9b0"/><stop offset="1" stop-color="transparent"/></radialGradient>
    <radialGradient id="cagelt" cx="50%" cy="20%" r="80%"><stop offset="0" stop-color="#fff4d6" stop-opacity=".5"/><stop offset="1" stop-color="transparent"/></radialGradient>
  </defs>
  <rect width="1000" height="600" fill="url(#gwall)"/>
  <rect width="1000" height="46" fill="#0c0f17"/>${trusses}${lights}
  ${winds}
  <!-- BFC wall banner -->
  <rect x="60" y="78" width="220" height="92" rx="6" fill="#171b27" /><rect x="60" y="78" width="220" height="92" rx="6" fill="#171b27" stroke="#2a2f3d"/>
  <text x="170" y="128" font-family="Cinzel,serif" font-weight="900" font-size="44" fill="#e11d2e" text-anchor="middle">B<tspan fill="#f5c542">F</tspan>C</text>
  <text x="170" y="152" font-family="VT323,monospace" font-size="15" letter-spacing="3" fill="#7a8295" text-anchor="middle">TRAIN • FIGHT • RISE</text>
  <!-- floor -->
  <rect y="300" width="1000" height="300" fill="url(#gfloor)"/>
  <ellipse cx="500" cy="300" rx="520" ry="30" fill="#00000040"/>
  <!-- mat zone -->
  <path d="M120 340 L880 340 L960 600 L40 600 Z" fill="#1f2531"/>
  <path d="M120 340 L880 340 L960 600 L40 600 Z" fill="url(#cagelt)"/>
  <line x1="500" y1="340" x2="500" y2="600" stroke="#00000022" stroke-width="2"/>
  <path d="M300 340 L230 600 M700 340 L770 600" stroke="#ffffff0c" stroke-width="2"/>
  ${bags}
  <!-- cage platform back-right -->
  <g transform="translate(820 250)" opacity=".92">
    <ellipse cx="0" cy="46" rx="120" ry="26" fill="#0c0f17"/>

  const m=(mood||'').toLowerCase();
  if(/(angry|fierce|furious|intense|menac|fired|electric|amped)/.test(m))return'narrow';
  if(/(shock|stunn|surpris|wide|nervous|anxious)/.test(m))return'wide';
  if(/(happy|confident|smil|joy|elated|proud|relief|relieved|hyped|beaming)/.test(m))return'happy';
  return'normal';
}

  if(!p.length){
    const card=S.world.card||{};
    (card.bouts||[]).forEach(b=>{p.push(b.red,b.blue)});
    p=p.filter(id=>S.chars[id]);
  }
  return p.slice(0, window.innerWidth<620?6:8);
}
function activeSpeakers(){
  for(let i=S.feed.length-1;i>=0;i--){
    if(S.feed[i].type==='interaction'){
      const s=new Set();(S.feed[i].dialogue||[]).forEach(d=>s.add(d.speaker));return s;
    }
  }
  return new Set();
}
function latestFor(cid){
  for(let i=S.feed.length-1;i>=0;i--){
    const e=S.feed[i];
    if(e.character===cid && (e.thought||e.action)) return e;
  }
  return null;
}
function layoutFighters(){
  const wrap=document.getElementById('fighters');
  // only show fighters when viewing the LIVE scene (the one the story is in)
  const showLive = (viewScene===curScene);
  const present = showLive ? presentList() : presentSceneFallback(viewScene);
  wrap.innerHTML='';
  const n=present.length||1;
  // bubbles only for the men actually talking this cycle (keeps the scene readable)
  const speakers = showLive ? activeSpeakers() : new Set();
  const fewEnough = present.length<=4;
  present.forEach((cid,i)=>{
    const c=F(cid);
    const x = (100/(n+1))*(i+1);
    const depth = (i%2)? 0 : 1; // simple two-row stagger for depth
    const div=document.createElement('div');
    div.className='fg'; div.style.left=x+'%';
    div.style.setProperty('--cc', c.color||'#888');
    div.style.bottom=(7+depth*4)+'%';
    div.style.zIndex=10+(depth?0:1);
    const sc=1 - depth*0.08;
    div.style.transform=`translateX(-50%) scale(${sc})`;
    const lat = (showLive && (speakers.has(cid) || fewEnough)) ? latestFor(cid) : null;
    const thought = lat && lat.thought ? lat.thought : '';
    div.innerHTML =
      (thought?`<div class="bubble show"><div class="bn" style="color:${c.color}">${firstName(cid)}</div>${thought}</div>`:'')+
      fighterSVG(cid)+
      `<div class="nametag">${c.champion?'<span class="belt">🏆 </span>':''}${firstName(cid)}</div>`;
    div.onclick=()=>showStat(cid);
    wrap.appendChild(div);
  });
}
function presentSceneFallback(scene){
  // when browsing a non-live scene, show a representative set so it's never empty
  const champs=Object.values(S.world.champions||{}).filter(id=>S.chars[id]);
  return champs.slice(0,6);
}

/* ════════════ rankings overlay ════════════ */
function renderRankings(){
  const tabs=document.getElementById('rk-tabs');
  tabs.innerHTML=DIV_ORDER.map(d=>`<button class="rk-tab ${d===rkTab?'on':''}" onclick="rkTab='${d}';renderRankings()">${DIVS[d].emoji} ${DIVS[d].short}</button>`).join('');
  const order=(S.world.rankings||{})[rkTab]||[];
  const list=document.getElementById('rk-list');
  list.innerHTML=`<div style="text-align:center;font-size:11px;color:var(--dim);margin-bottom:6px">${DIVS[rkTab].emoji} ${DIVS[rkTab].label} · ${DIVS[rkTab].weight} lb</div>`+
    order.map((id,i)=>{
      const c=F(id); const champ=i===0;
      const strk=c.streak>1?`<span class="rk-strk" style="background:rgba(74,222,128,.16);color:#86efac">W${c.streak}</span>`:'';
      return `<div class="rk-row ${champ?'champ':''}" onclick="showStat('${id}')">
        <div class="rk-pos">${champ?'🏆':'#'+i}</div>
        <div class="rk-info"><div class="rk-nm">${c.flag||''} ${fn(id)} ${c.nickname?`<span class="nick">"${c.nickname}"</span>`:''}</div>
          <div class="rk-sub">${c.style||''}</div></div>
        <div class="rk-rec">${recStr(c)}${strk}</div>
      </div>`;
    }).join('');
}

/* ════════════ fight card poster ════════════ */
function renderCard(){
  const card=S.world.card||{};
  const bouts=(card.bouts||[]).slice().sort((a,b)=>slotRank(a.slot)-slotRank(b.slot));
  const isResults = card.status==='complete';
  const p=document.getElementById('poster');
  p.innerHTML=`<div class="poster-top">
      <div class="ev">${card.event||'BFC'}</div>
      <div class="sub">${isResults?'Results':'Fight Card'}</div>
      <div class="when">${card.date_label||''} · main card</div>
    </div>`+
    bouts.map(b=>{
      const r=F(b.red),bl=F(b.blue),res=b.result;
      const rw=res&&res.winner===b.red, bw=res&&res.winner===b.blue;
      return `<div class="bout ${b.slot==='main'?'main':''}">
        <div class="bl">${b.title?'<span class="belt-i">🏆 </span>':''}${b.billing||''} ${b.slot==='main'?'· MAIN EVENT':b.slot==='co-main'?'· CO-MAIN':''}</div>
        <div class="bout-row">
          <div class="bcorner ${rw?'win':''}" onclick="showStat('${b.red}')"><div class="fl">${r.flag||''}</div><div class="nm">${fn(b.red)}</div><div class="rc">${recStr(r)}</div></div>
          <div class="vs">VS</div>
          <div class="bcorner ${bw?'win':''}" onclick="showStat('${b.blue}')"><div class="fl">${bl.flag||''}</div><div class="nm">${fn(b.blue)}</div><div class="rc">${recStr(bl)}</div></div>
        </div>
        ${res?`<div class="res">${F(res.winner).name} def. ${F(res.loser).name} · ${res.method_detail||res.method}${res.round?(' R'+res.round):''}${res.war?' · WAR':''}</div>`:''}
      </div>`;
    }).join('');
}
function slotRank(s){return s==='main'?0:s==='co-main'?1:s==='prelim'?3:2}

/* ════════════ stat card ════════════ */
function showStat(cid){
  const c=F(cid); if(!c.name)return;
  const sc=c.scores||{};
  const attr=(k,label)=>`<div class="attr-row"><div class="k">${label}</div><div class="attr-bar"><i style="width:${sc[k]||0}%"></i></div></div>`;
  const hurt=c.condition&&c.condition!=='fresh';
  const lr=c.last_result;
  document.getElementById('statbody').innerHTML=`
    <div class="sc-hero">
      <div class="sc-fig">${fighterSVG(cid)}</div>
      <div class="sc-id">
        <div class="sc-nm">${c.flag||''} ${c.name}</div>
        ${c.nickname?`<div class="sc-nick">"${c.nickname}"</div>`:'<div class="sc-nick" style="opacity:.4">—</div>'}
        <div class="sc-badges">
          ${c.champion?'<span class="sc-bdg belt">🏆 CHAMPION</span>':`<span class="sc-bdg">#${c.rank} ${DIVS[c.division].short}</span>`}
          <span class="sc-bdg">${DIVS[c.division].emoji} ${DIVS[c.division].label}</span>
          <span class="sc-bdg cond ${hurt?'hurt':''}">${hurt?'🩹 '+c.condition:'✓ fresh'}</span>
        </div>
        <div class="sc-rec">${recStr(c)}<small> W-L${(c.record&&c.record.d)?'-D':''}</small></div>
      </div>
    </div>
    <div class="sc-style">"The ${cap(c.archetype||'contender')}" · ${c.style||''}</div>
    <div class="sc-grid">
      <div class="sc-stat"><div class="v">${c.age||'—'}</div><div class="k">Age</div></div>
      <div class="sc-stat"><div class="v">${c.height||'—'}</div><div class="k">Height</div></div>
      <div class="sc-stat"><div class="v">${c.reach||'—'}</div><div class="k">Reach</div></div>
      <div class="sc-stat"><div class="v" style="font-size:13px">${cap(c.stance||'orthodox')}</div><div class="k">Stance</div></div>
      <div class="sc-stat"><div class="v">${c.nationality||'—'}</div><div class="k">From</div></div>
      <div class="sc-stat"><div class="v">${c.streak>1?'W'+c.streak:'—'}</div><div class="k">Streak</div></div>
    </div>
    <div class="sc-hook">${c.hook||c.bio||''}</div>
    <div class="sc-attr">
      ${attr('aggression','Aggression')}${attr('iq','Fight IQ')}${attr('discipline','Discipline')}
      ${attr('heart','Heart')}${attr('charisma','Charisma')}${attr('ego','Ego')}
    </div>
    ${lr?`<div class="sc-last">Last out: <b>${lr.outcome==='W'?'def.':'lost to'}</b> ${fn(lr.vs)} — ${lr.method} <span style="opacity:.6">(${lr.event})</span></div>`:''}`;
  openOv('stat');
}
function cap(s){return (s||'').replace(/\b\w/g,m=>m.toUpperCase())}

/* ════════════ overlays ════════════ */
function openOv(which){
  closeOv();
  if(which==='rankings')renderRankings();
  if(which==='card')renderCard();
  document.getElementById('ov-'+which).classList.add('show');
}
function closeOv(){document.querySelectorAll('.ov').forEach(o=>o.classList.remove('show'))}

/* ════════════ scene tabs + bottom mic ════════════ */
function buildTabs(){
  const t=document.getElementById('scenetabs');
  t.innerHTML=SCENES.map(s=>`<button class="stab" data-s="${s}" onclick="applyScene('${s}')"><span class="e">${SCENE_META[s].emoji}</span><span class="t">${SCENE_META[s].label}</span></button>`).join('');
}
function renderMic(){
  const w=S.world;
  document.getElementById('pulse-txt').textContent=w.pulse||'';
  // latest interaction
  let inter=null;
  for(let i=S.feed.length-1;i>=0;i--){if(S.feed[i].type==='interaction'){inter=S.feed[i];break}}
  const t=document.getElementById('transcript');
  if(inter){
    const lines=(inter.dialogue||[]).slice(-4);
    t.innerHTML=`<div class="desc">${inter.description||''}</div>`+
      lines.map(d=>{const c=F(d.speaker);return `<div class="ln" style="--cc:${c.color||'#fff'}"><b>${firstName(d.speaker)||d.speaker}:</b> ${d.line}</div>`}).join('');
  } else { t.innerHTML=`<div class="desc">${w.scene_blurb||''}</div>`; }
  document.getElementById('mic-ev').textContent=`${(w.week_label||'').split('—')[0].trim()} · Day ${w.day||1}`;
}

/* ════════════ render ════════════ */
function render(){
  const w=S.world;
  curScene=w.scene||'gym';
  // event chip
  const card=w.card||{};
  document.getElementById('ev-chip').innerHTML=`<b>${card.event||'BFC'}</b> · ${(SCENE_META[curScene]||{}).label||''}`;
  buildTabs();
  // live scene gets the LIVE dot
  if(!viewScene) viewScene=curScene;
  applyScene(viewScene);
  document.querySelectorAll('.stab').forEach(b=>b.classList.toggle('live', b.dataset.s===curScene));
  renderMic();
  // refresh any open overlay
  if(document.getElementById('ov-rankings').classList.contains('show'))renderRankings();
  if(document.getElementById('ov-card').classList.contains('show'))renderCard();
}

loadData();
setInterval(loadData, 90000);
window.addEventListener('resize', ()=>{ if(viewScene)layoutFighters(); });
</script>
</body>
</html>
