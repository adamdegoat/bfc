<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>BFC — Best Fighting Championship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#e11d2e; --red2:#ff2d40; --gold:#f5c542; --gold2:#ffe08a;
  --ink:#0a0c12; --ink2:#11131c; --panel:rgba(16,18,28,.82); --line:rgba(255,255,255,.10);
  --txt:#f3f4f8; --dim:rgba(243,244,248,.6);
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--txt);
  font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ── top bar ── */
#topbar{position:relative;z-index:40;display:flex;align-items:center;gap:10px;
  padding:8px 12px;background:linear-gradient(180deg,rgba(8,9,14,.96),rgba(8,9,14,.7) 70%,transparent);
  flex:0 0 auto}
.brand{display:flex;align-items:center;text-decoration:none;flex:0 1 auto;min-width:0;overflow:hidden}
.bfc-logo{height:38px;width:auto;display:block;flex:0 1 auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
#evchip{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.chip{background:rgba(225,29,46,.16);border:1px solid rgba(225,29,46,.5);color:#ffd9dd;
  border-radius:999px;padding:4px 11px;font-size:11px;font-weight:800;letter-spacing:.4px;white-space:nowrap}
.chip b{color:#fff}
.cyc-chip{background:rgba(245,197,66,.12);border-color:rgba(245,197,66,.45);color:#ffe08a;display:inline-flex;align-items:center;gap:6px}
.cyc-chip .livedot{width:6px;height:6px;border-radius:50%;background:#39ff9d;box-shadow:0 0 7px #39ff9d;animation:pulse 1.4s infinite}
.hublink{color:var(--dim);text-decoration:none;font-size:11px;font-weight:700;border:1px solid var(--line);
  border-radius:999px;padding:5px 10px;white-space:nowrap}
.hublink:hover{color:#fff;border-color:var(--gold)}

/* ── stage ── */
#stage{position:relative;flex:1 1 auto;overflow:hidden}
#canvas{position:absolute;inset:0}
#scene-svg{position:absolute;inset:0;width:100%;height:100%}
#scene-svg svg{width:100%;height:100%;display:block}
#daze{position:absolute;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(120% 75% at 50% 6%,rgba(255,233,176,.05),transparent 30%),
             radial-gradient(125% 90% at 50% 14%,transparent 52%,rgba(0,0,0,.62))}
#motes{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.mote{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe9b0;opacity:0;
  filter:blur(.4px);animation:drift linear infinite}
@keyframes drift{0%{opacity:0;transform:translate(0,0)}15%{opacity:.55}80%{opacity:.4}100%{opacity:0;transform:translate(18px,-70px)}}
#fighters{position:absolute;inset:0;z-index:10}
#panhint{display:none}
.emptynote{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);text-align:center;
  max-width:300px;background:rgba(8,9,14,.66);border:1px solid var(--line);border-radius:12px;
  padding:9px 15px;font-size:12px;font-weight:600;color:var(--dim);backdrop-filter:blur(4px)}
.fg{position:absolute;bottom:8%;transform:translateX(-50%);cursor:pointer;transition:filter .2s;
  display:flex;flex-direction:column;align-items:center;will-change:transform}
.fg::after{content:'';position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);
  width:46px;height:13px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);z-index:-1}
.fg .figwrap{animation:idle var(--idledur,4.2s) ease-in-out infinite;transform-origin:50% 100%}
@keyframes idle{0%,100%{transform:scaleY(1) rotate(0deg)}50%{transform:scaleY(1.02) rotate(var(--sway,0deg))}}
.fg:hover{filter:drop-shadow(0 0 9px rgba(245,197,66,.6))}
.fg .nametag{margin-top:2px;font-size:9px;font-weight:800;letter-spacing:.2px;color:#fff;
  background:rgba(0,0,0,.55);border-radius:5px;padding:1px 6px;white-space:nowrap;
  border-bottom:2px solid var(--cc,#888)}
.fg .nametag .belt{color:var(--gold)}
.char-svg{display:block;overflow:visible;filter:drop-shadow(0 5px 5px rgba(0,0,0,.45))}
.bubble{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:5px;
  max-width:150px;background:rgba(12,14,22,.94);border:1px solid var(--line);border-radius:10px;
  padding:5px 9px;font-size:11px;line-height:1.25;color:#eef;text-align:center;
  box-shadow:0 6px 16px rgba(0,0,0,.5);opacity:0;transition:opacity .3s;pointer-events:none}
.bubble.show{opacity:1}
.bubble:after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:rgba(12,14,22,.94)}
.bubble .bn{font-size:8.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;margin-bottom:1px}

/* ── scene toggle (sits at the top of the mic panel) ── */
#scenetabs{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:0 auto 7px;width:max-content;max-width:100%;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:4px}
.stab{border:none;background:transparent;color:var(--dim);font-family:inherit;font-size:11px;font-weight:700;
  padding:5px 11px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:4px;white-space:nowrap}
.stab.on{background:var(--red);color:#fff}
.stab .e{font-size:13px}
.stab.live:after{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 7px var(--gold);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hbag{transform-box:fill-box;transform-origin:center top;animation:bagsway 3.4s ease-in-out infinite}
@keyframes bagsway{0%,100%{transform:rotate(-2.6deg)}50%{transform:rotate(2.6deg)}}
.twinkle{animation:twk 2.6s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.12}50%{opacity:.95}}
.pyro-flame{transform-box:fill-box;transform-origin:50% 100%;animation:pyro .55s ease-in-out infinite alternate}
@keyframes pyro{0%{transform:scaleY(.82) scaleX(1.04)}100%{transform:scaleY(1.18) scaleX(.9)}}
.crowdwave{animation:cwave 9s linear infinite}
@keyframes cwave{from{transform:translateX(0)}to{transform:translateX(1300px)}}
.pa-ticker{animation:paticker 22s linear infinite}
@keyframes paticker{from{transform:translateX(1000px)}to{transform:translateX(-1100px)}}
.rope-d{animation:roped .9s steps(1) infinite}
.rope-u{animation:ropeu .9s steps(1) infinite}
@keyframes roped{0%,48%{opacity:.6}49%,100%{opacity:0}}
@keyframes ropeu{0%,48%{opacity:0}49%,100%{opacity:.4}}
.flash{opacity:.1;animation:flash 2.2s steps(1) infinite}
@keyframes flash{0%,96%{opacity:.12}97%,99%{opacity:1}100%{opacity:.12}}
.sweep,.sweep2{transform-box:view-box;transform-origin:500px 22px}
.sweep{animation:sweepA 7s ease-in-out infinite}
.sweep2{animation:sweepA 9.5s ease-in-out infinite reverse}
@keyframes sweepA{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}

/* ── side buttons (pinned to the viewport so panning never moves them) ── */
#sidebtns{position:fixed;right:10px;top:50px;z-index:45;display:flex;flex-direction:column;gap:7px}
.sbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:11px;
  padding:8px 11px;font-family:inherit;font-size:11px;font-weight:800;letter-spacing:.3px;cursor:pointer;
  backdrop-filter:blur(8px);display:flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.sbtn:hover{border-color:var(--gold)}
.sbtn .e{font-size:14px}

/* ── bottom mic / pulse ── */
#mic{position:relative;z-index:30;flex:0 0 auto;background:linear-gradient(0deg,rgba(8,9,14,.98),rgba(8,9,14,.84));
  border-top:1px solid var(--line);padding:7px 12px 8px;height:auto;display:flex;flex-direction:column;gap:5px;
  transition:height .32s cubic-bezier(.4,0,.2,1),box-shadow .32s ease}
#mic.open{height:72vh;box-shadow:0 -12px 40px rgba(0,0,0,.55);border-top-color:rgba(245,197,66,.3)}
#chat-feed{display:none}
#mic.open #chat-feed{display:block}
#feedbar{display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:800;letter-spacing:1.2px;color:var(--gold2);text-transform:uppercase}
#feedbar .fdot{width:7px;height:7px;border-radius:50%;background:var(--red2);box-shadow:0 0 8px var(--red2);animation:pulse 1.1s infinite}
#feedchev{color:var(--dim);font-size:11px;transition:transform .25s}
#mic.open #feedchev{transform:rotate(180deg)}
#pulse{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--gold2);font-weight:600;line-height:1.3;flex:0 0 auto}
#pulse .dot{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
#chat-feed{flex:1 1 auto;overflow-y:auto;font-size:13px;line-height:1.4;padding-right:4px;-webkit-overflow-scrolling:touch}
#chat-feed::-webkit-scrollbar{width:4px}#chat-feed::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:4px}
.cl-ts{font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);
  text-align:center;padding:8px 0 4px;border-top:1px solid var(--line);margin-top:6px}
.cl-ts:first-child{border-top:none;margin-top:0}
.cl-ts.latest{color:var(--gold)}
.cl-ts .rel{color:var(--red2);font-weight:700}
.cl-label{display:block;color:var(--dim);font-style:italic;font-size:12.5px;margin:3px 0 5px;line-height:1.45}
.cl-msg{margin:2px 0;line-height:1.4}
.cl-msg .spk{font-weight:800}
.cl-msg .ln{color:#e6e8f0}
#micfoot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:4px;border-top:1px solid var(--line)}
#micfoot a{color:var(--gold);text-decoration:none;font-size:11px;font-weight:800;letter-spacing:.3px}
#status-strip{display:flex;align-items:center;gap:4px;font-size:10px;flex-wrap:wrap;min-width:0}
.hud-day{font-weight:800;color:#fff;font-size:11px;flex-shrink:0;margin-right:2px}
.stp{display:inline-flex;align-items:center;padding:2px 7px;border-radius:7px;font-weight:700;white-space:nowrap;
  color:var(--dim);border:1px solid var(--line);background:rgba(255,255,255,.03)}
.stp.running{color:#fbbf24;border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.1);animation:pulse 1s ease-in-out infinite}
.stp.done{color:#4ade80;border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.08)}
.stp.current{color:#fff;border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.09)}
.stp-arr{color:rgba(255,255,255,.18);font-size:9px}
.stp-next{color:var(--gold2);font-weight:700;margin-left:4px;white-space:nowrap}

/* ── overlays ── */
.ov{position:fixed;inset:0;z-index:80;background:rgba(4,5,9,.74);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:14px}
.ov.show{display:flex}
.sheet{background:linear-gradient(180deg,var(--ink2),#0a0b11);border:1px solid var(--line);
  border-radius:18px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.7);position:relative}
.sheet::-webkit-scrollbar{width:0}
.x{position:absolute;top:10px;right:12px;z-index:3;background:rgba(0,0,0,.4);border:1px solid var(--line);
  color:#fff;width:30px;height:30px;border-radius:50%;font-size:17px;cursor:pointer;line-height:1}
.sh-head{font-family:'Anton',sans-serif;font-weight:900;font-size:16px;letter-spacing:.5px;color:#fff;
  padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sh-head .e{color:var(--red2)}

/* rankings board */
.rk-tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 12px 4px;scrollbar-width:none}
.rk-tabs::-webkit-scrollbar{display:none}
.rk-tab{flex:0 0 auto;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim);
  border-radius:999px;padding:5px 10px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
.rk-tab.on{background:var(--gold);color:#1a1300;border-color:var(--gold)}
.rk-list{padding:8px 12px 16px}
.rk-row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:10px;cursor:pointer;
  border:1px solid transparent}
.rk-row:hover{background:rgba(255,255,255,.04);border-color:var(--line)}
.rk-row.champ{background:linear-gradient(90deg,rgba(245,197,66,.16),rgba(245,197,66,.02));
  border-color:rgba(245,197,66,.35)}
.rk-pos{flex:0 0 30px;text-align:center;font-family:'Oswald',sans-serif;font-size:19px;color:var(--dim)}
.rk-row.champ .rk-pos{color:var(--gold)}
.rk-info{flex:1 1 auto;min-width:0}
.rk-nm{font-size:13px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk-nm .nick{color:var(--dim);font-weight:600;font-size:11px}
.rk-sub{font-size:10.5px;color:var(--dim)}
.rk-rec{flex:0 0 auto;font-family:'Oswald',sans-serif;font-size:16px;color:var(--gold2)}
.rk-strk{font-size:9px;font-weight:800;padding:1px 5px;border-radius:5px;margin-left:5px}

/* fight card poster */
.poster{padding:0 0 16px}
.poster-top{text-align:center;padding:18px 16px 12px;background:
  radial-gradient(120% 100% at 50% 0%,rgba(225,29,46,.28),transparent 70%);border-bottom:1px solid var(--line)}
.poster-top .ev{font-family:'Anton',sans-serif;font-weight:900;font-size:30px;letter-spacing:1px;color:#fff;line-height:1}
.poster-top .sub{font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-top:5px}
.poster-top .when{font-size:11px;color:var(--dim);margin-top:3px}
.bout{padding:11px 14px;border-bottom:1px solid var(--line)}
.bout .bl{font-size:9.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);
  text-align:center;margin-bottom:6px}
.bout.main .bl{color:var(--gold)}
.bout-row{display:flex;align-items:center;justify-content:center;gap:8px}
.bcorner{flex:1 1 0;min-width:0;text-align:center}
.bcorner .fl{font-size:17px}
.bcorner .nm{font-size:13px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcorner .rc{font-family:'Oswald',sans-serif;font-size:14px;color:var(--gold2)}
.bcorner.win .nm{color:var(--gold)}
.bcorner.win:after{content:' ✓';color:#4ade80}
.vs{flex:0 0 auto;font-family:'Anton',sans-serif;font-weight:900;color:var(--red2);font-size:14px}
.bout .res{text-align:center;font-size:10.5px;color:#4ade80;font-weight:700;margin-top:5px}
.belt-i{color:var(--gold)}

/* stat card */
.sc-hero{display:flex;gap:12px;padding:14px 16px;align-items:flex-start;
  background:radial-gradient(100% 120% at 100% 0%,rgba(225,29,46,.18),transparent 60%)}
.sc-fig{flex:0 0 96px;height:128px;display:flex;align-items:flex-end;justify-content:center;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent);border-radius:12px;border:1px solid var(--line)}
.sc-id{flex:1 1 auto;min-width:0}
.sc-nm{font-family:'Anton',sans-serif;font-weight:900;font-size:19px;color:#fff;line-height:1.05}
.sc-nick{font-size:12px;font-weight:700;color:var(--gold);font-style:italic;margin:1px 0 6px}
.sc-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.sc-bdg{font-size:9.5px;font-weight:800;letter-spacing:.3px;padding:2px 7px;border-radius:6px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);color:#fff}
.sc-bdg.belt{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1a1300;border:none}
.sc-bdg.cond{background:rgba(74,222,128,.14);color:#86efac;border-color:rgba(74,222,128,.3)}
.sc-bdg.cond.hurt{background:rgba(248,113,113,.14);color:#fca5a5;border-color:rgba(248,113,113,.3)}
.sc-rec{font-family:'Oswald',sans-serif;font-size:30px;color:var(--gold2);line-height:.9}
.sc-rec small{font-size:12px;color:var(--dim)}
.sc-style{font-size:12px;color:var(--dim);padding:0 16px 4px;font-style:italic}
.sc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px 16px}
.sc-stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:9px;padding:7px 8px;text-align:center}
.sc-stat .v{font-family:'Oswald',sans-serif;font-size:18px;color:#fff}
.sc-stat .k{font-size:8.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
.sc-hook{padding:8px 16px 4px;font-size:12.5px;line-height:1.4;color:#d9dbe6}
.sc-attr{padding:6px 16px 16px}
.attr-row{display:flex;align-items:center;gap:8px;margin:4px 0}
.attr-row .k{flex:0 0 78px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--dim)}
.attr-bar{flex:1 1 auto;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.attr-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--red),var(--gold))}
.sc-last{margin:0 16px 14px;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.04);
  border:1px solid var(--line);font-size:11.5px;color:var(--dim)}
.sc-last b{color:#fff}

/* ── superstars ── */
.sbtn-star{background:linear-gradient(135deg,rgba(245,197,66,.22),rgba(225,29,46,.14));border-color:rgba(245,197,66,.5)}
.sbtn-star .e{filter:drop-shadow(0 0 4px rgba(245,197,66,.8))}
.fg.star .figwrap{filter:drop-shadow(0 0 9px rgba(245,197,66,.5))}
.fg.star .nametag{border-bottom-color:var(--gold);box-shadow:0 0 12px rgba(245,197,66,.25)}
.star-pip{filter:drop-shadow(0 0 3px rgba(245,197,66,.9))}
.rk-row.isstar .rk-nm{color:#fff}
.sc-starbanner{text-align:center;font-size:10.5px;font-weight:800;letter-spacing:1px;color:#1a1300;
  background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold));padding:6px;text-transform:uppercase}
.sc-hero.star{background:radial-gradient(100% 130% at 100% 0%,rgba(245,197,66,.22),transparent 60%)}
.stars-intro{text-align:center;color:var(--dim);font-size:12px;padding:12px 16px 4px;font-style:italic}
.starcard{display:flex;align-items:center;gap:10px;margin:8px 12px;padding:8px;border-radius:14px;cursor:pointer;
  background:linear-gradient(100deg,rgba(245,197,66,.10),rgba(255,255,255,.02));
  border:1px solid rgba(245,197,66,.3);position:relative;overflow:hidden}
.starcard:hover{border-color:var(--gold)}
.star-fig{flex:0 0 62px;height:92px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;
  background:radial-gradient(80% 90% at 50% 100%,rgba(245,197,66,.18),transparent);border-radius:10px}
.star-fig .char-svg{height:88px;width:auto;filter:drop-shadow(0 0 7px rgba(245,197,66,.5))}
.star-info{flex:1 1 auto;min-width:0}
.star-tag{font-size:9.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--gold)}
.star-nm{font-family:'Anton',sans-serif;font-weight:900;font-size:16px;color:#fff;line-height:1.05}
.star-nick{font-size:11px;font-style:italic;color:var(--gold2);margin-bottom:2px}
.star-meta{font-size:11px;color:var(--dim);margin-bottom:3px}
.star-hype{font-size:11.5px;line-height:1.35;color:#dcdfe8}
.star-p4p{flex:0 0 auto;text-align:center;font-size:8px;font-weight:800;letter-spacing:1px;color:var(--gold);
  background:rgba(0,0,0,.3);border:1px solid rgba(245,197,66,.4);border-radius:9px;padding:5px 8px}
.star-p4p b{font-family:'Oswald',sans-serif;font-size:18px;color:#fff}

@media(max-width:620px){
  #topbar{padding:7px 8px;gap:6px}
  .bfc-logo{height:27px}
  #evchip{gap:5px}
  .chip{font-size:9.5px;padding:3px 8px}

<script>
/* ════════════════════════════════════════════════════════════════════
   BFC front-end. Data: data/characters.json, world.json, feed.json
   ════════════════════════════════════════════════════════════════════ */
const DIVS = {
  featherweight:{label:'Featherweight',short:'FW',emoji:'🪶',weight:'145'},
  lightweight:{label:'Lightweight',short:'LW',emoji:'⚡',weight:'155'},
  middleweight:{label:'Middleweight',short:'MW',emoji:'🔥',weight:'185'},
  light_heavyweight:{label:'Light Heavyweight',short:'LHW',emoji:'💪',weight:'205'},
  heavyweight:{label:'Heavyweight',short:'HW',emoji:'🗿',weight:'265'},
};
const DIV_ORDER = Object.keys(DIVS);
const SCENES = ['gym','weighin','arena','recovery'];
const SCENE_META = {
  gym:{label:'Gym',emoji:'🏋️'}, weighin:{label:'Weigh-Ins',emoji:'⚖️'},
  arena:{label:'Arena',emoji:'🏟️'}, recovery:{label:'Recovery',emoji:'🩹'},
};
let S = {chars:{},world:{},feed:[]};
let curScene = null, viewScene = null, rkTab = 'lightweight';

async function loadData(){
  const bust = '?t='+Date.now();
  const [c,w,f] = await Promise.all([
    fetch('data/characters.json'+bust).then(r=>r.json()),
    fetch('data/world.json'+bust).then(r=>r.json()),
    fetch('data/feed.json'+bust).then(r=>r.json()),
  ]);
  S.chars=c; S.world=w; S.feed=f;
  render();
}

/* ── helpers ── */
const F = id => S.chars[id] || {};
const fn = id => (F(id).name)||id;
// Fighters go by their SURNAME everywhere (matches how the narrator names them) — "Cross", "Tamiev".
const firstName = id => { const p=fn(id).trim().split(' '); return p[p.length-1]; };
function recStr(c){const r=c.record||{w:0,l:0,d:0};return r.w+'-'+r.l+(r.d?('-'+r.d):'')}
function rankTag(c){return c.champion?'C':('#'+(c.rank))}

/* ════════════ SCENES — bespoke SVG backdrops (viewBox 0 0 1000 600) ════════════ */
function sceneSVG(scene){
  if(scene==='gym') return GYM();
  if(scene==='weighin') return WEIGHIN();
  if(scene==='arena') return ARENA();
  return RECOVERY();
}
const spec = (n,fn)=>{let s='';for(let i=0;i<n;i++)s+=fn(i);return s};

function GYM(){
  // crowd of heavy bags + a cage platform + ring, industrial wall
  const bags = spec(5,i=>{const x=120+i*60;return `<g transform="translate(${x} 200)"><rect x="-1.5" y="-60" width="3" height="60" fill="#3a3f4a"/><g class="hbag" style="animation-delay:${(i*-0.7).toFixed(1)}s"><rect x="-13" y="-2" width="26" height="80" rx="11" fill="#${i%2?'b23b3b':'2a2f3a'}"/><rect x="-13" y="-2" width="26" height="80" rx="11" fill="url(#bagsh)"/><rect x="-13" y="10" width="26" height="5" fill="#00000033"/><rect x="-13" y="38" width="26" height="5" fill="#00000033"/><rect x="-6" y="-4" width="12" height="4" rx="2" fill="#15171d"/></g></g>`});
  const trusses = spec(7,i=>`<rect x="${60+i*135}" y="0" width="5" height="46" fill="#1a1e27"/>`);
  const lights = spec(6,i=>`<g transform="translate(${110+i*160} 44)"><rect x="-22" y="-6" width="44" height="9" rx="3" fill="#11141c"/><circle cx="0" cy="0" r="4" fill="#ffe9b0" opacity=".9"/><ellipse cx="0" cy="40" rx="58" ry="150" fill="url(#beam)" opacity=".16"/><ellipse cx="0" cy="430" rx="74" ry="40" fill="url(#beam)" opacity=".07"/></g>`);
  // big windows looking out over a night-city skyline (scenery)
  const cityWindow=(x,y,w,h,seed)=>{
    let b=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#nsky)"/>`;
    b+=`<circle cx="${x+w*0.72}" cy="${y+16}" r="6.5" fill="#cfe0f0" opacity=".45"/>`;
    for(let s=0;s<10;s++) b+=`<circle cx="${x+((s*53+seed*17)%w)}" cy="${y+((s*31)%(h*0.5))}" r=".8" fill="#fff" opacity=".4"/>`;
    const cols=7, bw=w/cols;
    for(let i=0;i<cols;i++){const bx=x+i*bw, bh=24+((i*47+seed*29)%(h-34)), by=y+h-bh;
      b+=`<rect x="${bx}" y="${by}" width="${bw-1.5}" height="${bh}" fill="#0a0e17"/>`;
      const rows=Math.floor(bh/9);
      for(let r=0;r<rows;r++)for(let c=0;c<2;c++){ if((i*7+r*5+c+seed)%3===0) b+=`<rect x="${(bx+2+c*(bw/2)).toFixed(1)}" y="${(by+4+r*9).toFixed(1)}" width="2.4" height="3" fill="#ffd98a" opacity="${(.35+((i+r)%3)*.18).toFixed(2)}"/>`; }
    }
    return `<g>${b}</g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="none" stroke="#0a0c12" stroke-width="3.5"/><line x1="${x+w/2}" y1="${y}" x2="${x+w/2}" y2="${y+h}" stroke="#0a0c12" stroke-width="3"/><line x1="${x}" y1="${y+h/2}" x2="${x+w}" y2="${y+h/2}" stroke="#0a0c12" stroke-width="3"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="url(#beam)" opacity=".04"/>`;
  };

    <radialGradient id="beam" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#ffe9b0"/><stop offset="1" stop-color="transparent"/></radialGradient>

    <linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8db"/><stop offset=".33" stop-color="#f7d35f"/><stop offset=".5" stop-color="#e7b637"/><stop offset=".515" stop-color="#a9760c"/><stop offset=".7" stop-color="#e2ad2e"/><stop offset="1" stop-color="#7d5505"/></linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5063"/><stop offset="1" stop-color="#b00f1d"/></linearGradient>

  </defs>
  <rect width="1000" height="600" fill="url(#gwall)"/>

  ${bags}
  <!-- cage platform back-right -->

    <ellipse cx="0" cy="46" rx="120" ry="26" fill="#0c0f17"/>
    <rect x="-118" y="20" width="236" height="30" fill="#222734"/><rect x="-118" y="20" width="236" height="30" fill="#222734"/>
    ${spec(11,i=>`<line x1="${-110+i*22}" y1="-70" x2="${-110+i*22}" y2="22" stroke="#3a4150" stroke-width="1.4" opacity=".5"/>`)}
    ${spec(5,i=>`<line x1="-112" y1="${-60+i*18}" x2="112" y2="${-60+i*18}" stroke="#3a4150" stroke-width="1.4" opacity=".5"/>`)}

function applyScene(scene){
  viewScene = scene;
  document.getElementById('scene-svg').innerHTML = sceneSVG(scene);
  document.querySelectorAll('.stab').forEach(b=>{
    b.classList.toggle('on', b.dataset.s===scene);
  });
  if(scene==='arena') updateArenaScreens();
  layoutFighters();
}
// the arena's jumbotron + corner screens reflect the live main event (or its result)
function updateArenaScreens(){
  const card=S.world.card||{};
  const main=(card.bouts||[]).find(b=>b.slot==='main')||(card.bouts||[])[0];
  const set=(id,t)=>{const e=document.getElementById(id); if(e) e.textContent=t;};
  set('jumbo-ev', card.event||'BFC');
  if(!main){ return; }
  const r=F(main.red), b=F(main.blue), res=main.result;
  if(res){
    set('jumbo-sub', `${firstName(res.winner)} def. ${firstName(res.loser)}`);
  } else {
    set('jumbo-sub', `${firstName(main.red)} vs ${firstName(main.blue)}`);
  }
  set('scr-l-nm', firstName(main.red).toUpperCase()); set('scr-l-rec', recStr(r));
  set('scr-r-nm', firstName(main.blue).toUpperCase()); set('scr-r-rec', recStr(b));
}

function moodFace(mood){
  const m=(mood||'').toLowerCase();
  if(/(angry|fierce|furious|intense|menac|fired|electric|amped)/.test(m))return'narrow';
  if(/(shock|stunn|surpris|wide|nervous|anxious)/.test(m))return'wide';
  if(/(happy|confident|smil|joy|elated|proud|relief|relieved|hyped|beaming)/.test(m))return'happy';
  return'normal';
}

  <path d="M -0.6 -71.8 Q -1.7 -68.6 -1 -67.6 Q 0 -67 1 -67.6" stroke="#00000026" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="${face==='happy'?'M -4 -64.6 Q 0 -61 4 -64.6':face==='narrow'?'M -3.6 -63.6 Q 0 -64.6 3.6 -63.6':'M -3.6 -64.4 Q 0 -62.4 3.6 -64.4'}" stroke="#9c4b3f" stroke-width="1.7" stroke-linecap="round" fill="none"/>
  ${armsSVG}
  </svg>`;
}
function hairSVG(style,hc){
  switch(style){
    case 'bald': return {back:'',front:''};
    case 'buzz': return {back:'',front:`<path d="M -11 -75.5 C -11.5 -86 -5 -86.5 0 -86.5 C 5 -86.5 11.5 -86 11 -75.5 C 8 -82 -8 -82 -11 -75.5 Z" fill="${hc}" opacity=".9"/>`};
    default: return {back:'',front:`<path d="M -11.3 -74 C -12 -88 -4 -88 0 -88.5 C 5 -88.5 12 -87.5 11.3 -74 C 9 -80 -9 -80 -11.3 -74 Z" fill="${hc}"/>`};
  }
}

/* ════════════ layout fighters in the scene ════════════ */
function presentList(){
  let p = (S.world.present||[]).filter(id=>S.chars[id]);
  if(!p.length){
    const card=S.world.card||{};
    (card.bouts||[]).forEach(b=>{p.push(b.red,b.blue)});
    p=p.filter(id=>S.chars[id]);
  }
  return p.slice(0, window.innerWidth<620?6:8);
}
function activeSpeakers(){
  for(let i=S.feed.length-1;i>=0;i--){
    if(S.feed[i].type==='interaction'){
      const s=new Set();(S.feed[i].dialogue||[]).forEach(d=>s.add(d.speaker));return s;
    }
  }
  return new Set();
}
function latestFor(cid){
  for(let i=S.feed.length-1;i>=0;i--){
    const e=S.feed[i];
    if(e.character===cid && (e.thought||e.action)) return e;
  }
  return null;
}
// ── natural "stations" per scene: a facing pair mid-floor (spots 0+1) then
//    scattered spots at varied depth — NOT an even row. {x:left%, b:bottom%, s:scale, f:'l'|'r' facing} ──
const SPOTS={
  gym:[
    {x:45,b:9,s:1.04,f:'r',a:'ready'},{x:55,b:9,s:1.04,f:'l',a:'ready'},  // 0+1 face-to-face on the mat
    {x:15,b:16,s:0.80,f:'r',a:'punch'},                   // working the heavy bags
    {x:29,b:7,s:1.10,f:'r',a:'skip'},                     // skipping rope, foreground
    {x:73,b:15,s:0.84,f:'l',a:'guard'},                   // shadow-boxing by the cage
    {x:87,b:8,s:1.02,f:'l',a:'stretch'},                  // stretching/warming up, foreground right
    {x:63,b:19,s:0.74,f:'l',a:'punch'},                   // bag work, deep back
    {x:8,b:10,s:0.96,f:'r',a:'guard'},                    // far left shadow-boxing
  ],
  weighin:[
    {x:43,b:13,s:1.06,f:'r',a:'ready'},{x:57,b:13,s:1.06,f:'l',a:'ready'},   // face-off on the scale
    {x:21,b:10,s:0.94,f:'r'},{x:79,b:10,s:0.94,f:'l'},
    {x:32,b:8,s:1.02,f:'r'},{x:68,b:8,s:1.02,f:'l'},
    {x:11,b:14,s:0.82,f:'r'},{x:89,b:14,s:0.82,f:'l'},
  ],
  arena:[
    {x:46,b:15,s:1.06,f:'r',a:'guard'},{x:54,b:15,s:1.06,f:'l',a:'guard'},   // the two squared up in the cage
    {x:20,b:9,s:0.92,f:'r'},{x:80,b:9,s:0.92,f:'l'},
    {x:33,b:20,s:0.78,f:'r'},{x:67,b:20,s:0.78,f:'l'},
    {x:12,b:11,s:0.9,f:'r'},{x:88,b:11,s:0.9,f:'l'},
  ],
  recovery:[
    {x:26,b:8,s:1.02,f:'r'},{x:43,b:12,s:0.9,f:'r'},
    {x:58,b:12,s:0.9,f:'l'},{x:74,b:8,s:1.02,f:'l'},
    {x:15,b:15,s:0.80,f:'r'},{x:86,b:15,s:0.80,f:'l'},
    {x:50,b:7,s:1.06,f:'l'},{x:34,b:17,s:0.76,f:'r'},
  ],
};
const SCENE_WAIT={
  weighin:'⚖️ Weigh-ins are Friday — the stage is empty until then.',
  arena:'🏟️ Fight night is Saturday — the arena is dark until the walkouts.',
  recovery:'🩹 The recovery room fills Sunday, after the fights.',
  gym:'🏋️ The gym is quiet right now.',
};
function layoutFighters(){
  const wrap=document.getElementById('fighters');
  wrap.innerHTML='';
  const showLive = (viewScene===curScene);
  // A future/past venue is EMPTY until its day — nobody's at the arena on a Tuesday.
  if(!showLive){
    wrap.innerHTML=`<div class="emptynote">${SCENE_WAIT[viewScene]||''}</div>`;
    return;
  }
  let present = presentList();
  // lead with the two men actually talking so they take the face-to-face centre spots
  const sp=[...activeSpeakers()].filter(id=>present.includes(id));
  if(sp.length>=2){ present=[sp[0],sp[1],...present.filter(id=>id!==sp[0]&&id!==sp[1])]; }
  const speakers = activeSpeakers();
  const fewEnough = present.length<=4;
  const spots = SPOTS[viewScene]||SPOTS.gym;
  present.slice(0,spots.length).forEach((cid,i)=>{
    const c=F(cid); const sp=spots[i];
    const h=cid.split('').reduce((a,ch)=>a+ch.charCodeAt(0),0);
    const div=document.createElement('div');
    div.className='fg'+(c.star?' star':'');
    div.style.left=(sp.x + ((h%3)-1)*0.6)+'%';
    div.style.bottom=(sp.b + ((h%3)-1))+'%';
    div.style.setProperty('--cc', c.color||'#888');
    div.style.zIndex=Math.round(120 - sp.b);     // closer (smaller bottom) draws on top
    div.style.transform=`translateX(-50%) scale(${sp.s})`;
    const flip = sp.f==='l' ? -1 : 1;
    const lat = (speakers.has(cid) || fewEnough) ? latestFor(cid) : null;
    const thought = lat && lat.thought ? lat.thought : '';
    const dur=(3.6 + (h%9)*0.18).toFixed(2), sway=(((h%5)-2)*0.5).toFixed(1), delay=(-(h%7)*0.4).toFixed(2);
    div.innerHTML =
      (thought?`<div class="bubble show"><div class="bn" style="color:${c.color}">${firstName(cid)}</div>${thought}</div>`:'')+
      `<div class="figface" style="transform:scaleX(${flip})"><div class="figwrap" style="--idledur:${dur}s;--sway:${sway}deg;animation-delay:${delay}s">`+fighterSVG(cid, sp.a)+`</div></div>`+
      `<div class="nametag">${c.champion?'<span class="belt">🏆 </span>':c.star?'<span class="belt">⭐ </span>':''}${firstName(cid)}</div>`;
    div.onclick=()=>showStat(cid);
    wrap.appendChild(div);
  });
  const stage=document.getElementById('stage');
  if(stage && window.innerWidth<620){ stage.scrollLeft=(760-window.innerWidth)/2; }
}

/* ════════════ rankings overlay ════════════ */
function renderRankings(){
  const tabs=document.getElementById('rk-tabs');
  tabs.innerHTML=DIV_ORDER.map(d=>`<button class="rk-tab ${d===rkTab?'on':''}" onclick="rkTab='${d}';renderRankings()">${DIVS[d].emoji} ${DIVS[d].short}</button>`).join('');
  const order=(S.world.rankings||{})[rkTab]||[];
  const list=document.getElementById('rk-list');
  list.innerHTML=`<div style="text-align:center;font-size:11px;color:var(--dim);margin-bottom:6px">${DIVS[rkTab].emoji} ${DIVS[rkTab].label} · ${DIVS[rkTab].weight} lb</div>`+
    order.map((id,i)=>{
      const c=F(id); const champ=i===0;
      const strk=c.streak>1?`<span class="rk-strk" style="background:rgba(74,222,128,.16);color:#86efac">W${c.streak}</span>`:'';
      return `<div class="rk-row ${champ?'champ':''} ${c.star?'isstar':''}" onclick="showStat('${id}')">
        <div class="rk-pos">${champ?'🏆':'#'+i}</div>
        <div class="rk-info"><div class="rk-nm">${c.flag||''} ${fn(id)} ${c.nickname?`<span class="nick">"${c.nickname}"</span>`:''} ${c.star?'<span class="star-pip">⭐</span>':''}</div>
          <div class="rk-sub">${c.star?`<span style="color:var(--gold)">${c.star_tag}</span> · `:''}${c.style||''}</div></div>
        <div class="rk-rec">${recStr(c)}${strk}</div>
      </div>`;
    }).join('');
}

/* ════════════ fight card poster ════════════ */
function renderCard(){
  const card=S.world.card||{};
  const bouts=(card.bouts||[]).slice().sort((a,b)=>slotRank(a.slot)-slotRank(b.slot));
  const isResults = card.status==='complete';
  const p=document.getElementById('poster');
  p.innerHTML=`<div class="poster-top">
      <div class="ev">${card.event||'BFC'}</div>
      <div class="sub">${isResults?'Results':'Fight Card'}</div>
      <div class="when">${card.date_label||''} · main card</div>
    </div>`+
    bouts.map(b=>{
      const r=F(b.red),bl=F(b.blue),res=b.result;
      const rw=res&&res.winner===b.red, bw=res&&res.winner===b.blue;
      return `<div class="bout ${b.slot==='main'?'main':''}">
        <div class="bl">${b.title?'<span class="belt-i">🏆 </span>':''}${b.billing||''} ${b.slot==='main'?'· MAIN EVENT':b.slot==='co-main'?'· CO-MAIN':''}</div>
        <div class="bout-row">
          <div class="bcorner ${rw?'win':''}" onclick="showStat('${b.red}')"><div class="fl">${r.flag||''}</div><div class="nm">${fn(b.red)}</div><div class="rc">${recStr(r)}</div></div>
          <div class="vs">VS</div>
          <div class="bcorner ${bw?'win':''}" onclick="showStat('${b.blue}')"><div class="fl">${bl.flag||''}</div><div class="nm">${fn(b.blue)}</div><div class="rc">${recStr(bl)}</div></div>
        </div>
        ${res?`<div class="res">${F(res.winner).name} def. ${F(res.loser).name} · ${res.method_detail||res.method}${res.round?(' R'+res.round):''}${res.war?' · WAR':''}</div>`:''}
      </div>`;
    }).join('');
}
function slotRank(s){return s==='main'?0:s==='co-main'?1:s==='prelim'?3:2}

/* ════════════ stat card ════════════ */
function showStat(cid){
  const c=F(cid); if(!c.name)return;
  const sc=c.scores||{};
  const attr=(k,label)=>`<div class="attr-row"><div class="k">${label}</div><div class="attr-bar"><i style="width:${sc[k]||0}%"></i></div></div>`;
  const hurt=c.condition&&c.condition!=='fresh';
  const lr=c.last_result;
  document.getElementById('statbody').innerHTML=`
    ${c.star?`<div class="sc-starbanner">⭐ BFC SUPERSTAR · ${c.star_tag} · P4P #${c.draw_rank}</div>`:''}
    <div class="sc-hero ${c.star?'star':''}">
      <div class="sc-fig">${fighterSVG(cid)}</div>
      <div class="sc-id">
        <div class="sc-nm">${c.flag||''} ${c.name}</div>
        ${c.nickname?`<div class="sc-nick">"${c.nickname}"</div>`:'<div class="sc-nick" style="opacity:.4">—</div>'}
        <div class="sc-badges">
          ${c.champion?'<span class="sc-bdg belt">🏆 CHAMPION</span>':`<span class="sc-bdg">#${c.rank} ${DIVS[c.division].short}</span>`}
          <span class="sc-bdg">${DIVS[c.division].emoji} ${DIVS[c.division].label}</span>
          <span class="sc-bdg cond ${hurt?'hurt':''}">${hurt?'🩹 '+c.condition:'✓ fresh'}</span>
        </div>
        <div class="sc-rec">${recStr(c)}<small> W-L${(c.record&&c.record.d)?'-D':''}</small></div>
      </div>
    </div>
    <div class="sc-style">"The ${cap(c.archetype||'contender')}" · ${c.style||''}</div>
    <div class="sc-grid">
      <div class="sc-stat"><div class="v">${c.age||'—'}</div><div class="k">Age</div></div>
      <div class="sc-stat"><div class="v">${c.height||'—'}</div><div class="k">Height</div></div>
      <div class="sc-stat"><div class="v">${c.reach||'—'}</div><div class="k">Reach</div></div>
      <div class="sc-stat"><div class="v" style="font-size:13px">${cap(c.stance||'orthodox')}</div><div class="k">Stance</div></div>
      <div class="sc-stat"><div class="v">${c.nationality||'—'}</div><div class="k">From</div></div>
      <div class="sc-stat"><div class="v">${c.streak>1?'W'+c.streak:'—'}</div><div class="k">Streak</div></div>
    </div>
    <div class="sc-hook">${c.hook||c.bio||''}</div>
    <div class="sc-attr">
      ${attr('aggression','Aggression')}${attr('iq','Fight IQ')}${attr('discipline','Discipline')}
      ${attr('heart','Heart')}${attr('charisma','Charisma')}${attr('ego','Ego')}
    </div>
    ${lr?`<div class="sc-last">Last out: <b>${lr.outcome==='W'?'def.':'lost to'}</b> ${fn(lr.vs)} — ${lr.method} <span style="opacity:.6">(${lr.event})</span></div>`:''}`;
  openOv('stat');
}
function cap(s){return (s||'').replace(/\b\w/g,m=>m.toUpperCase())}

/* ════════════ overlays ════════════ */
function openOv(which){
  closeOv();
  if(which==='rankings')renderRankings();
  if(which==='card')renderCard();
  if(which==='stars')renderStars();
  document.getElementById('ov-'+which).classList.add('show');
}
function renderStars(){
  const stars=Object.values(S.chars).filter(c=>c.star).sort((a,b)=>(a.draw_rank||9)-(b.draw_rank||9));
  document.getElementById('stars-body').innerHTML=
    `<div class="stars-intro">The faces that sell the fights — the draws everyone tunes in for.</div>`+
    stars.map(c=>{
      const champ=c.champion;
      return `<div class="starcard" onclick="closeOv();showStat('${c.id}')">
        <div class="star-fig">${fighterSVG(c.id)}</div>
        <div class="star-info">
          <div class="star-tag">⭐ ${c.star_tag}</div>
          <div class="star-nm">${c.flag} ${c.name}</div>
          <div class="star-nick">"${c.nickname}"</div>
          <div class="star-meta">${DIVS[c.division].emoji} ${champ?'<b style="color:var(--gold)">Champion</b>':'#'+c.rank+' '+DIVS[c.division].short} · <span style="font-family:Oswald,sans-serif;font-size:14px;color:var(--gold2)">${recStr(c)}</span></div>
          <div class="star-hype">${c.hype||c.hook}</div>
        </div>
        <div class="star-p4p">P4P<br><b>#${c.draw_rank}</b></div>
      </div>`;
    }).join('');
}
function closeOv(){document.querySelectorAll('.ov').forEach(o=>o.classList.remove('show'))}

/* ════════════ scene tabs + bottom mic ════════════ */
let _motesBuilt=false;
function initMotes(){
  if(_motesBuilt)return; _motesBuilt=true;
  const m=document.getElementById('motes'); if(!m)return;
  let h='';
  for(let i=0;i<18;i++){
    const x=Math.random()*100, y=40+Math.random()*55, sz=(2+Math.random()*2.4).toFixed(1),
          dur=(7+Math.random()*9).toFixed(1), del=(-Math.random()*12).toFixed(1);
    h+=`<div class="mote" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;width:${sz}px;height:${sz}px;animation-duration:${dur}s;animation-delay:${del}s"></div>`;
  }
  m.innerHTML=h;
}
function buildTabs(){
  const t=document.getElementById('scenetabs');
  t.innerHTML=SCENES.map(s=>`<button class="stab" data-s="${s}" onclick="applyScene('${s}')"><span class="e">${SCENE_META[s].emoji}</span><span class="t">${SCENE_META[s].label}</span></button>`).join('');
}
// countdown to the next live cycle (SGT 7:00 / 11:30 / 15:00 / 18:30 / 22:30) — like the sibling worlds
function nextCycleETA(){
  const n=new Date(); const sgt=new Date(n.getTime()+n.getTimezoneOffset()*60000+8*3600000);
  const mins=sgt.getHours()*60+sgt.getMinutes();
  const slots=[7*60,11*60+30,15*60,18*60+30,22*60+30];
  let next=slots.find(s=>s>mins); if(next==null) next=slots[0]+1440;
  const d=next-mins, h=Math.floor(d/60), m=d%60;
  return h>0?`${h}h ${m}m`:`${m}m`;
}
const ALL_STEPS=['morning','midday','afternoon','evening','night'];
function updateStatusBar(){
  const w=S.world||{};
  const hd=document.getElementById('hud-day'); if(hd) hd.textContent='Day '+(w.day||1);
  const ns=document.getElementById('stp-next'); if(ns) ns.textContent='next in '+nextCycleETA();
  // which cycles have already RUN today → turn green (like the sibling worlds)
  const done=new Set();
  (S.feed||[]).forEach(e=>{ if(e.day===(w.day||1)) done.add(e.cycle); });
  ALL_STEPS.forEach(s=>{
    const el=document.getElementById('stp-'+s); if(!el) return;
    el.classList.remove('done','current','running');
    if(done.has(s)) el.classList.add('done');
  });
  if(w.cycle && !done.has(w.cycle)) document.getElementById('stp-'+w.cycle)?.classList.add('current');
}
function toggleFeed(){ document.getElementById('mic').classList.toggle('open'); }
function cycLabel(e){ return `Day ${e.day} · ${cap(e.cycle||'')}`; }
function renderMic(){
  const w=S.world;
  document.getElementById('pulse-txt').textContent=w.pulse||'';
  // ── FULL conversation feed (every line, like the other worlds) ──
  const feedEl=document.getElementById('chat-feed');
  const ents=S.feed.slice(-50);
  let latestLbl=''; ents.forEach(e=>{latestLbl=cycLabel(e);});
  let html='', last='';
  ents.forEach(e=>{
    const lbl=cycLabel(e); const isLatest=lbl===latestLbl;
    if(lbl!==last){
      const rel=isLatest?` <span class="rel">● Latest</span>`:'';
      html+=`<div class="cl-ts${isLatest?' latest':''}">${(SCENE_META[e.scene]||{}).emoji||'🥊'} ${lbl}${rel}</div>`;
      last=lbl;
    }
    if(e.type==='interaction' && e.description){
      html+=`<div class="cl-label">${e.description}</div>`;
      (e.dialogue||[]).forEach(d=>{
        html+=`<div class="cl-msg"><span class="spk" style="color:${col(d.speaker)}">${firstName(d.speaker)||d.speaker}:</span> <span class="ln">${d.line||''}</span></div>`;
      });
    } else if(e.type==='results' && e.bouts){
      html+=`<div class="cl-label">🏆 ${e.event} results:</div>`;
      e.bouts.forEach(b=>{const r=b.result||{};
        html+=`<div class="cl-msg"><span class="spk" style="color:var(--gold)">${firstName(r.winner)}</span> <span class="ln">def. ${firstName(r.loser)} — ${r.method_detail||r.method||''}${r.round?(' R'+r.round):''}</span></div>`;});
    }
  });
  feedEl.innerHTML=html || `<div class="cl-label">${w.scene_blurb||'The feed is warming up…'}</div>`;
  feedEl.scrollTop=feedEl.scrollHeight;
}
const col=id=>(F(id).color)||'#fff';

/* ════════════ render ════════════ */
function render(){
  const w=S.world;
  curScene=w.scene||'gym';
  // event chip
  const card=w.card||{};
  document.getElementById('ev-chip').innerHTML=`<b>${card.event||'BFC'}</b> · ${(SCENE_META[curScene]||{}).label||''}`;
  buildTabs();
  initMotes();
  updateStatusBar();
  // live scene gets the LIVE dot
  if(!viewScene) viewScene=curScene;
  applyScene(viewScene);
  document.querySelectorAll('.stab').forEach(b=>b.classList.toggle('live', b.dataset.s===curScene));
  renderMic();
  // refresh any open overlay
  if(document.getElementById('ov-rankings').classList.contains('show'))renderRankings();
  if(document.getElementById('ov-card').classList.contains('show'))renderCard();
}

loadData();
setInterval(loadData, 90000);
setInterval(updateStatusBar, 30000);
window.addEventListener('resize', ()=>{ if(viewScene)layoutFighters(); });
</script>
